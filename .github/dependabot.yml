# Weekly pull requests for new versions of the GitHub Actions and the pinned
# Python packages; minor and patch updates are grouped to keep the number low.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/docs/website"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
        # A new PyMOL wheel needs the files in edited/ ported first (see
        # automations/build_exe.py), so it gets a pull request of its own
        exclude-patterns: ["pymol-open-source-whl"]
