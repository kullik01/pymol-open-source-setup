# Weekly pull requests for new versions of the GitHub Actions and the pinned
# Python packages; minor and patch updates are grouped to keep the number low.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/os_specific/linux"
      - "/os_specific/macos"
      - "/os_specific/windows"
      - "/docs/website"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
