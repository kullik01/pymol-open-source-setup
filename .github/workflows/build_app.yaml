name: Build app packages

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

# Cancel outdated runs of the same pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  # More robust against temporary network problems with PyPI
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "10"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ----- Windows build section
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'os_specific/windows/requirements.txt'

      - name: Extract project version
        run: echo "PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" >> "$GITHUB_ENV"

      - name: Create virtual environment
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install wheel setuptools
          .venv/Scripts/python -m pip install -r os_specific/windows/requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile "$env:RUNNER_TEMP\innosetup.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\innosetup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait

      - name: Build frozen application
        shell: cmd
        run: win_automator.bat build app

      - name: Smoke test
        timeout-minutes: 5
        run: tests/run_smoke_test.sh "dist/exe.win-amd64-${PYTHON_VERSION}/Open-Source-PyMOL.exe"

      - name: Build installer
        shell: cmd
        run: win_automator.bat build inno_setup

      - name: Create portable archive
        run: 7z a -tzip -bso0 -bsp0 "os_specific/dist/PyMOL-Open-Source_v${PROJECT_VERSION}_x64_portable.zip" "./dist/exe.win-amd64-${PYTHON_VERSION}/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyMOL-Open-Source-Windows-x64-Setup
          path: os_specific/dist/*
  # --- end

  # ----- macOS build section
  build-macos:
    # macos-13 is unsupported due to a bug in the `create-dmg` action
    # macos-14 runner images were retired by GitHub
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'os_specific/macos/requirements.txt'

      - name: Extract project version
        run: echo "PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" >> "$GITHUB_ENV"

      - name: Create virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install wheel setuptools
          .venv/bin/python -m pip install -r os_specific/macos/requirements.txt

      - name: Build app bundle
        run: ./automator.sh build app

      - name: Ad-hoc sign app bundle
        # Prevents Gatekeeper "damaged app" errors
        run: codesign --force --deep --sign - "dist/PyMOL-Open-Source-${PROJECT_VERSION}.app"

      - name: Smoke test
        timeout-minutes: 5
        run: |
          tests/run_smoke_test.sh "dist/PyMOL-Open-Source-${PROJECT_VERSION}.app/Contents/MacOS/PyMOL"
          codesign --verify --deep "dist/PyMOL-Open-Source-${PROJECT_VERSION}.app"

      - name: Ensure no other process is using the DMG
        run: hdiutil detach /Volumes/PyMOL-Open-Source || true

      - name: Build DMG with retry
        uses: urban233/create-dmg-actions@v0.0.2
        with:
          dmg_name: 'PyMOL-Open-Source_v${{ env.PROJECT_VERSION }}'
          src_dir: 'dist/PyMOL-Open-Source-${{ env.PROJECT_VERSION }}.app'
          bg_filepath: 'os_specific/macos/dmg/bg.png'
        env:
          RETRIES: 3
          RETRY_DELAY: 10

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyMOL-Open-Source-macOS-macos-15-Setup
          path: ./*.dmg
  # --- end

  # ----- GNU Linux build section
  build-gnu-linux:
    # The oldest available runner, so the app also runs on older distributions
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'os_specific/linux/requirements.txt'

      - name: Create virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install wheel setuptools
          .venv/bin/python -m pip install -r os_specific/linux/requirements.txt

      - name: Build frozen application
        run: ./automator.sh build app

      - name: Smoke test
        timeout-minutes: 5
        run: tests/run_smoke_test.sh dist/exe.linux-*/Open-Source-PyMOL

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          sudo gem install --no-document fpm

      - name: Build .tar.gz, .deb and .rpm packages
        run: os_specific/linux/build_packages.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyMOL-Open-Source-GNU-Linux-x86_64-Setup
          path: os_specific/dist/*

  # Installs the packages on clean distributions (the package manager has to
  # resolve all declared dependencies) and runs the headless and GUI smoke tests.
  test-gnu-linux-packages:
    needs: build-gnu-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:22.04', package: 'deb' }
          - { image: 'ubuntu:24.04', package: 'deb' }
          - { image: 'debian:12', package: 'deb' }
          - { image: 'fedora:latest', package: 'rpm' }
          - { image: 'rockylinux/rockylinux:9', package: 'rpm' }
          - { image: 'almalinux:8', package: 'rpm' }
          - { image: 'registry.opensuse.org/opensuse/tumbleweed:latest', package: 'rpm' }
          # The Leap image has no tar, which actions/checkout needs
          - { image: 'registry.opensuse.org/opensuse/leap:15.6', package: 'rpm', setup: 'zypper --non-interactive install tar gzip' }
    name: test-gnu-linux-packages (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install checkout prerequisites
        if: matrix.setup
        run: ${{ matrix.setup }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: tests

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: PyMOL-Open-Source-GNU-Linux-x86_64-Setup
          path: packages

      - name: Install package and run smoke tests
        timeout-minutes: 15
        shell: bash
        run: tests/test_linux_package.sh packages/*.${{ matrix.package }}
  # --- end
