name: Build app packages

on:
  push:
    branches:
      - master
      - main
    # A version tag (v<version from pyproject.toml>) creates a draft release
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Cancel outdated runs of the same pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # More robust against temporary network problems with PyPI
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "10"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # The smoke tests also download a structure from the PDB (HTTPS)
  PYMOL_SMOKE_TEST_ONLINE: "1"

jobs:
  # ----- Windows build section
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'os_specific/windows/requirements.txt'

      - name: Extract project version
        run: echo "PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" >> "$GITHUB_ENV"

      - name: Create virtual environment
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install wheel setuptools
          .venv/Scripts/python -m pip install -r os_specific/windows/requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile "$env:RUNNER_TEMP\innosetup.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\innosetup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait

      - name: Build frozen application
        # Also downloads the Microsoft C++ runtime, which is bundled into the app
        timeout-minutes: 30
        shell: cmd
        run: win_automator.bat build app

      - name: Check the bundled C++ runtime
        run: .venv/Scripts/python tests/check_msvc_runtime.py "dist/exe.win-amd64-${PYTHON_VERSION}"

      - name: Smoke test
        timeout-minutes: 5
        run: tests/run_smoke_test.sh "dist/exe.win-amd64-${PYTHON_VERSION}/Open-Source-PyMOL.exe"

      - name: Build installer
        shell: cmd
        run: win_automator.bat build inno_setup

      - name: Install with the installer
        # Per-user install like on a user's PC (Git Bash would turn /VERYSILENT into a path)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $setup = Get-ChildItem "os_specific/dist/*_x64_setup.exe" | Select-Object -First 1
          $process = Start-Process $setup.FullName -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/LOG=$env:RUNNER_TEMP\install.log"
          if ($process.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log"; throw "Setup failed: $($process.ExitCode)" }
          $exe = Join-Path $env:APPDATA "PyMOL-Open-Source\bin\Open-Source-PyMOL.exe"
          if (-not (Test-Path $exe)) { throw "Not installed: $exe" }
          foreach ($folder in [Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs')) {
            if (-not (Test-Path (Join-Path $folder 'Open-Source PyMOL.lnk'))) { throw "Shortcut missing in $folder" }
          }
          foreach ($folder in [Environment]::GetFolderPath('CommonDesktopDirectory'), [Environment]::GetFolderPath('CommonPrograms'), [Environment]::GetFolderPath('CommonStartMenu')) {
            if (Test-Path (Join-Path $folder 'Open-Source PyMOL.lnk')) { throw "Shortcut in the All Users folder $folder" }
          }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{192F52C3-D86D-4735-9929-C7DF593CB534}_is1'
          $version = (Get-ItemProperty $key).DisplayVersion
          if ($version -ne $env:PROJECT_VERSION) { throw "Uninstall entry has version '$version'" }
          "INSTALLED_APP=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Smoke test of the installed app
        timeout-minutes: 5
        run: tests/run_smoke_test.sh "$(cygpath -u "$INSTALLED_APP")"

      - name: Uninstall
        timeout-minutes: 5
        shell: pwsh
        run: |
          $app = Join-Path $env:APPDATA "PyMOL-Open-Source"
          Start-Process (Join-Path $app "unins000.exe") -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # The uninstaller restarts itself from %TEMP%, so wait until the folder is gone
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path $app) { throw "Not uninstalled: $app" }
          foreach ($folder in [Environment]::GetFolderPath('Desktop'), [Environment]::GetFolderPath('Programs')) {
            if (Test-Path (Join-Path $folder 'Open-Source PyMOL.lnk')) { throw "Shortcut left in $folder" }
          }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{192F52C3-D86D-4735-9929-C7DF593CB534}_is1') { throw "Uninstall entry left" }

      - name: Create portable archive
        run: 7z a -tzip -bso0 -bsp0 "os_specific/dist/PyMOL-Open-Source_v${PROJECT_VERSION}_x64_portable.zip" "./dist/exe.win-amd64-${PYTHON_VERSION}/*"

      - name: Test portable archive
        timeout-minutes: 5
        run: |
          PORTABLE_DIR="${RUNNER_TEMP}/portable"
          7z x -bso0 -bsp0 -o"${PORTABLE_DIR}" "os_specific/dist/PyMOL-Open-Source_v${PROJECT_VERSION}_x64_portable.zip"
          tests/run_smoke_test.sh "${PORTABLE_DIR}/Open-Source-PyMOL.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: PyMOL-Open-Source-Windows-x64-Setup
          path: os_specific/dist/*
          # The packages are already compressed
          compression-level: 0
  # --- end

  # ----- macOS build section
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, label: AppleSilicon }
          # Last Intel (x86_64) runner image of GitHub, supported until August 2027
          - { runner: macos-15-intel, arch: x86_64, label: Intel }
    name: build-macos (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'os_specific/macos/requirements.txt'

      - name: Extract project version
        run: echo "PROJECT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" >> "$GITHUB_ENV"

      - name: Create virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install wheel setuptools
          .venv/bin/python -m pip install -r os_specific/macos/requirements.txt

      - name: Build app bundle
        run: ./automator.sh build app

      - name: Ad-hoc sign app bundle
        # Prevents Gatekeeper "damaged app" errors
        run: codesign --force --deep --sign - "dist/PyMOL-Open-Source-${PROJECT_VERSION}.app"

      - name: Smoke test
        timeout-minutes: 5
        run: |
          tests/run_smoke_test.sh "dist/PyMOL-Open-Source-${PROJECT_VERSION}.app/Contents/MacOS/PyMOL"
          codesign --verify --deep "dist/PyMOL-Open-Source-${PROJECT_VERSION}.app"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: os_specific/macos/build_dmg.sh

      - name: Verify DMG
        # Mounts the DMG like a user would and tests the app inside it
        timeout-minutes: 5
        run: |
          DMGS=(os_specific/dist/*.dmg)
          test "${#DMGS[@]}" -eq 1
          DMG="${DMGS[0]}"
          hdiutil verify "$DMG"
          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT_DIR"
          trap 'hdiutil detach "$MOUNT_DIR"' EXIT
          ls -la "$MOUNT_DIR"
          test -L "$MOUNT_DIR/Applications"
          test -f "$MOUNT_DIR/.background/dmg_background.svg"
          APP="$MOUNT_DIR/PyMOL-Open-Source-${PROJECT_VERSION}.app"
          codesign --verify --deep "$APP"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" = "io.github.kullik01.pymol-open-source"
          # PyMOL, Qt and numpy must be built for the architecture of this runner
          for MODULE in "$APP"/Contents/Resources/lib/{pymol/_cmd.*.so,PyQt5/QtCore.abi3.so,numpy/core/_multiarray_umath.*.so}; do
            ARCHS="$(lipo -archs "$MODULE")"
            echo "${ARCHS}  ${MODULE#"$APP"/}"
            test "$ARCHS" = "${{ matrix.arch }}"
          done
          tests/run_smoke_test.sh "$APP/Contents/MacOS/PyMOL"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: PyMOL-Open-Source-macOS-${{ matrix.label }}-Setup
          path: os_specific/dist/*.dmg
          # The packages are already compressed
          compression-level: 0
  # --- end

  # ----- GNU Linux build section
  build-gnu-linux:
    # The oldest available runner, so the app also runs on older distributions
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'os_specific/linux/requirements.txt'

      - name: Create virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install wheel setuptools
          .venv/bin/python -m pip install -r os_specific/linux/requirements.txt

      - name: Build frozen application
        run: ./automator.sh build app

      - name: Smoke test
        timeout-minutes: 5
        run: tests/run_smoke_test.sh dist/exe.linux-*/Open-Source-PyMOL

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          sudo gem install --no-document fpm

      - name: Build .tar.gz, .deb and .rpm packages
        run: os_specific/linux/build_packages.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: PyMOL-Open-Source-GNU-Linux-x86_64-Setup
          path: os_specific/dist/*
          # The packages are already compressed
          compression-level: 0

  # Installs the packages on clean distributions (the package manager has to
  # resolve all declared dependencies) and runs the headless and GUI smoke tests.
  test-gnu-linux-packages:
    needs: build-gnu-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'ubuntu:22.04', package: 'deb' }
          - { image: 'ubuntu:24.04', package: 'deb' }
          - { image: 'debian:12', package: 'deb' }
          - { image: 'fedora:latest', package: 'rpm' }
          - { image: 'rockylinux/rockylinux:9', package: 'rpm' }
          - { image: 'almalinux:8', package: 'rpm' }
          - { image: 'registry.opensuse.org/opensuse/tumbleweed:latest', package: 'rpm' }
          # The Leap image has no tar, which actions/checkout needs
          - { image: 'registry.opensuse.org/opensuse/leap:15.6', package: 'rpm', setup: 'zypper --non-interactive install tar gzip' }
    name: test-gnu-linux-packages (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install checkout prerequisites
        if: matrix.setup
        run: ${{ matrix.setup }}

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: tests

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: PyMOL-Open-Source-GNU-Linux-x86_64-Setup
          path: packages

      - name: Install package and run smoke tests
        timeout-minutes: 15
        shell: bash
        run: tests/test_linux_package.sh packages/*.${{ matrix.package }}
  # --- end

  # ----- Website section
  # Builds the website strictly, in parallel to the app builds. For a version
  # tag it first checks that the tag matches the version, so a wrong tag fails
  # right at the start.
  website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          if [ "$GITHUB_REF_NAME" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${VERSION} in pyproject.toml" >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'docs/website/requirements.txt'

      - name: Build website
        run: |
          python -m pip install -r docs/website/requirements.txt
          mkdocs build --strict --config-file docs/website/mkdocs.yml --site-dir "${RUNNER_TEMP}/site"

      - name: Upload website
        uses: actions/upload-artifact@v6
        with:
          name: website
          path: ${{ runner.temp }}/site
  # --- end

  # ----- Release section
  # Checks on every run that the website download links and the built files
  # match. For a version tag it also creates a draft release with all files,
  # which can be checked and published on GitHub.
  release:
    needs: [website, build-windows, build-macos, build-gnu-linux, test-gnu-linux-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download website
        uses: actions/download-artifact@v7
        with:
          name: website
          path: site

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: PyMOL-Open-Source-*
          path: release-files
          merge-multiple: true

      - name: Check website download links against the packages
        run: ls release-files | tests/check_release_assets.sh site

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Empty if there is no release for the tag yet (the list includes drafts)
          IS_DRAFT="$(gh release list --limit 100 --json tagName,isDraft \
            --jq ".[] | select(.tagName == \"${GITHUB_REF_NAME}\") | .isDraft")"
          if [ -z "$IS_DRAFT" ]; then
            gh release create "$GITHUB_REF_NAME" release-files/* \
              --draft --verify-tag --generate-notes --title "Release ${GITHUB_REF_NAME}"
          elif [ "$IS_DRAFT" = "true" ]; then
            # A re-run replaces the files of the draft release
            gh release upload "$GITHUB_REF_NAME" release-files/* --clobber
          else
            echo "Release ${GITHUB_REF_NAME} is already published; its files are not replaced." >&2
            exit 1
          fi
  # --- end
