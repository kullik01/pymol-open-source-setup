name: Build Docs

# The website is checked on every pull request and push, but only published
# when a release is published (or manually), so its version, file names and
# download links always match the latest release.
on:
  pull_request:
  push:
    branches:
      - master
      - main
  release:
    types: [published]
  # Publishes the website of the selected branch or tag (Actions > Build Docs > Run workflow)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: 'docs/website/requirements.txt'
      - run: python -m pip install -r docs/website/requirements.txt
      - name: Build website
        working-directory: ./docs/website
        run: mkdocs build --strict

  deploy:
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: 'docs/website/requirements.txt'
      - run: python -m pip install -r docs/website/requirements.txt
      - name: Deploy to GitHub Pages
        working-directory: ./docs/website
        run: mkdocs gh-deploy --force
