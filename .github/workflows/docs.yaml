name: Build Docs

# The website is checked on every pull request and push, but only published
# when a release is published (or manually), so its version, file names and
# download links always match the latest release.
on:
  pull_request:
  push:
    branches:
      - master
      - main
  release:
    types: [published]
  # Publishes the website of the selected branch or tag (Actions > Build Docs > Run workflow)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: 'docs/website/requirements.txt'
      - run: python -m pip install -r docs/website/requirements.txt
      - name: Build website
        working-directory: ./docs/website
        run: mkdocs build --strict

  deploy:
    needs: build
    # Pre-releases do not replace the website of the latest release
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease)
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: 'docs/website/requirements.txt'
      - run: python -m pip install -r docs/website/requirements.txt
      - name: Check website download links against the published release
        # Every download link must point to a file of the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          if [ "$(gh release view "v${VERSION}" --json isDraft --jq .isDraft 2>/dev/null)" != "false" ]; then
            echo "Version ${VERSION} has no published release (v${VERSION}), so the website is not published." >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/release-files"
          gh release view "v${VERSION}" --json assets --jq '.assets[].name' \
            | while read -r NAME; do touch "${RUNNER_TEMP}/release-files/${NAME}"; done
          mkdocs build --strict --config-file docs/website/mkdocs.yml --site-dir "${RUNNER_TEMP}/site"
          tests/check_release_assets.sh "${RUNNER_TEMP}/release-files" "${RUNNER_TEMP}/site"
      - name: Deploy to GitHub Pages
        working-directory: ./docs/website
        run: mkdocs gh-deploy --force
