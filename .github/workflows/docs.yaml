name: Build Docs

# Publishes the website when a release is published (or manually), so its
# version, file names and download links always match the latest release.
# Pull requests and pushes check the website in the "website" job of
# build_app.yaml.
on:
  release:
    types: [published]
  # Publishes the website of the selected branch or tag (Actions > Build Docs > Run workflow)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Pre-releases do not replace the website of the latest release
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'docs/website/requirements.txt'
      - run: python -m pip install -r docs/website/requirements.txt

      - name: Build website
        run: mkdocs build --strict --config-file docs/website/mkdocs.yml --site-dir "${RUNNER_TEMP}/site"

      - name: Check website download links against the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          # Empty for a draft or a missing release
          RELEASE_FILES="$(gh release view "v${VERSION}" --json isDraft,assets \
            --jq 'select(.isDraft | not) | .assets[].name' 2>/dev/null || true)"
          if [ -z "$RELEASE_FILES" ]; then
            echo "Version ${VERSION} has no published release (v${VERSION}), so the website is not published." >&2
            exit 1
          fi
          echo "$RELEASE_FILES" | tests/check_release_assets.sh "${RUNNER_TEMP}/site"

      - name: Deploy to GitHub Pages
        # Publishes exactly the checked website (mkdocs gh-deploy uses the same tool)
        run: |
          ghp-import --no-jekyll --push --force \
            --message "Deployed ${GITHUB_SHA} with MkDocs (${GITHUB_REF_NAME})" "${RUNNER_TEMP}/site"
