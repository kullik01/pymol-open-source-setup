site_name: Open-Source PyMOL
site_url: https://kullik01.github.io/pymol-open-source-setup/
nav:
    - Home: index.md
    - Install:
          - Download: install.md
          - Install on Windows: install_windows.md
          - Install on macOS: install_macos.md
          - Install on Linux: install_linux.md
    - Manual: manual.md
    - Wiki: https://pymolwiki.org/index.php/Main_Page
    - About: about.md

theme:
    name: material
    # Keeps today's look with Zensical, the successor of Material for MkDocs (EOL May 2027)
    variant: classic
    custom_dir: material
    language: en
    logo: assets/images/logo.png
    favicon: assets/images/logo.png
    font:
        text: Roboto
        code: Roboto Mono
    palette:
        primary: custom
    features:
        - navigation.tabs
        - navigation.instant
            - navigation.instant.progress
        - toc.integrate
extra_css:
    - stylesheets/extra.css

plugins:
    # No search box (Zensical would enable search by default)
    - search:
        enabled: false
    - offline
    # Version, file names and download links from pyproject.toml, see main.py
    - macros:
        on_error_fail: true

markdown_extensions:
    - attr_list
    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg
        options:
          custom_icons:
            - overrides/.icons
    - md_in_html
    - admonition
    - pymdownx.details
    - pymdownx.superfences


copyright:
